<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Reset Password — Aura AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css?v=__ASSET_VERSION__" />
</head>
<body data-recovery-page="reset">
  <video id="authBgVideo" autoplay muted loop playsinline aria-hidden="true">
    <source src="aura-bg2.mp4" type="video/mp4" />
  </video>
  <div class="auth-shell">
    <div class="auth-backdrop" aria-hidden="true"></div>
    <main class="auth-card recovery-card" aria-labelledby="recoveryTitle">
      <div class="recovery-brand">
        <img src="/assets/aura-logo-64.png" alt="Aura AI" />
        <span class="recovery-brand-name">Aura AI</span>
      </div>
      <h1 id="recoveryTitle">Choose a new password</h1>
      <p class="recovery-description" id="resetDescription">We’re checking your password reset link.</p>
      <p class="recovery-status" id="resetStatus" role="status" aria-live="polite">Validating reset link…</p>
      <form class="recovery-form" id="resetPasswordForm" hidden novalidate>
        <label for="newPassword">New password</label>
        <div class="password-field">
          <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="passwordHint" required />
          <button class="password-toggle" type="button" data-target="newPassword" aria-label="Show new password" aria-pressed="false">Show</button>
        </div>
        <p class="recovery-note" id="passwordHint">Use at least 8 characters.</p>

        <label for="confirmPassword">Confirm new password</label>
        <div class="password-field">
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
          <button class="password-toggle" type="button" data-target="confirmPassword" aria-label="Show confirmation password" aria-pressed="false">Show</button>
        </div>
        <button class="primary-button" id="resetSubmitButton" type="submit">Update password</button>
      </form>
      <div class="recovery-footer">
        <a class="recovery-link" id="loginLink" href="/auth.html">Back to login</a>
        <a class="recovery-link" id="requestNewLink" href="/forgot-password.html" hidden>Request a new link</a>
      </div>
    </main>
  </div>
  <script src="js/password-recovery.js?v=__ASSET_VERSION__"></script>
</body>
</html>
