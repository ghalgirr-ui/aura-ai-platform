<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Forgot Password — Aura AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css?v=__ASSET_VERSION__" />
</head>
<body data-recovery-page="forgot">
  <video id="authBgVideo" autoplay muted loop playsinline aria-hidden="true">
    <source src="aura-bg2.mp4" type="video/mp4" />
  </video>
  <div class="auth-shell">
    <div class="auth-backdrop" aria-hidden="true"></div>
    <main class="auth-card recovery-card" aria-labelledby="recoveryTitle">
      <div class="recovery-brand">
        <img src="/assets/aura-logo-64.png" alt="Aura AI" />
        <span class="recovery-brand-name">Aura AI</span>
      </div>
      <h1 id="recoveryTitle">Forgot your password?</h1>
      <p class="recovery-description">Enter the email address linked to your Aura account and we’ll send instructions to reset your password.</p>
      <form class="recovery-form" id="forgotPasswordForm" novalidate>
        <label for="recoveryEmail">Email address</label>
        <input id="recoveryEmail" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@aura.ai" required />
        <button class="primary-button" type="submit">Send reset link</button>
      </form>
      <p class="recovery-status" id="recoveryStatus" role="status" aria-live="polite"></p>
      <div class="recovery-footer">
        <a class="recovery-link" href="/auth.html">Back to login</a>
      </div>
    </main>
  </div>
  <script src="js/password-recovery.js?v=__ASSET_VERSION__"></script>
</body>
</html>
